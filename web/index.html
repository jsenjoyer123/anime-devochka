<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✿ Айко-тян ✿</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <main id="stage">
    <div id="season"></div>
    <canvas id="scene"></canvas>
    <div id="badge">✿ Айко-тян <span id="outfit-name"></span> <span id="live">● LIVE</span></div>
    <div id="thinking" hidden></div>
    <section id="screen" hidden>
      <header>
        <span id="screen-title"></span>
        <span class="screen-nav">
          <button id="screen-prev" title="Предыдущий показ">◀</button>
          <button id="screen-next" title="Следующий показ">▶</button>
          <button id="screen-close" title="Убрать с экрана">✕</button>
        </span>
      </header>
      <div id="screen-body"></div>
    </section>
    <div id="subtitles"></div>
    <div id="drop-hint">Перетащи сюда .vrm-модель, чтобы сменить облик</div>
    <div id="loading">Айко-тян собирается на стрим…</div>
    <div id="toast" hidden></div>
  </main>

  <aside id="panel">
    <header>
      <div>
        <div class="title">Онбординг</div>
        <div id="meta" class="meta">подключаюсь…</div>
      </div>
      <div class="controls">
        <span id="spent" title="Потрачено на OpenRouter сегодня" hidden></span>
        <span id="mood" title="Настроение Айко">😐</span>
        <button id="watch" title="Следить за моими правками в проекте">👀</button>
        <button id="projects" title="Сменить проект">📁</button>
        <button id="mute" title="Голос вкл/выкл">🔊</button>
      </div>
      <div id="project-menu" hidden></div>
    </header>
    <button id="quest-bar" type="button" title="Онбординг-квест" hidden>
      <span id="quest-level"></span>
      <span class="bar"><span id="quest-fill"></span></span>
      <span id="quest-xp"></span>
    </button>
    <ol id="quest-list" hidden></ol>
    <div id="chat"></div>
    <div id="chips">
      <button type="button" id="next" class="chip" hidden>Дальше →</button>
      <button type="button" id="offer" class="chip" hidden>🔍 Глянь мои правки</button>
      <button type="button" id="twitch-answer" class="chip" hidden>💬 Ответить чату</button>
    </div>
    <button id="learn" hidden>✨ Изучить проект</button>
    <div id="actions">
      <button type="button" data-action="tour" title="Пошаговая экскурсия по коду">🗺 Экскурсия</button>
      <button type="button" data-action="review" title="Ревью незакоммиченных изменений">🔍 Ревью</button>
      <button type="button" data-action="doc" title="Написать ONBOARDING.md для команды">📄 ONBOARDING</button>
      <button type="button" data-action="first_task" title="Подобрать первую задачу (GitHub issues, TODO)">🎯 Задача</button>
      <button type="button" data-action="quiz" title="Экзамен по проекту">🎓 Экзамен</button>
      <button type="button" data-action="commit" title="Придумать сообщение и закоммитить (без push, после подтверждения)">✅ Коммит</button>
    </div>
    <form id="form">
      <button type="button" id="mic" title="Сказать голосом" hidden>🎤</button>
      <input id="input" autocomplete="off" placeholder="Спроси что-нибудь о проекте, семпай…">
      <button id="send">➤</button>
    </form>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
