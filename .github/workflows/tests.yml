name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Линт (ruff: ошибки и неиспользуемые имена)"
        run: pipx run ruff check .
      # упавшие тесты превращаем в аннотации: их видно через API без доступа к логам
      - name: "Тесты бэкенда (модель не вызывается)"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test.log || { python tests/ci_annotate.py test.log; exit 1; }

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: "Расширение VS Code (vscode подменён заглушкой)"
        run: node --test tests/vscode/*.test.js  # Node 22 не принимает каталог

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Playwright и Chromium"
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: "E2E: страница, подтверждения, меню (API модели подменён)"
        run: |
          set -o pipefail
          python -m unittest discover -s tests/e2e -v 2>&1 | tee test.log || { python tests/ci_annotate.py test.log; exit 1; }
